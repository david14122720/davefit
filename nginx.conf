server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # add_header no se hereda por locations que definen los suyos; esta línea
    # del nivel server restaura el header en /api/* y /health. Los locations
    # con headers propios (/_astro/, assets públicos, /, @ssr_fallback) ya lo
    # re-declaran explícitamente, así que no hay duplicados.
    add_header X-XSS-Protection "0" always;

    # ============================================================
    # Cliente pesado (1 núcleo CPU / 2 GB RAM):
    # - El supervisor delega el TRABAJO al navegador (SPA React).
    # - El servidor sirve estáticos DIRECTO desde disco (dist/client),
    #   sin atravesar el Node SSR de 1 núcleo, con .gz precomprimidos
    #   en build (gzip_static → cero CPU de compresión en runtime) y
    #   caché moderada: inmutable solo para assets hasheados, TTL
    #   corto para lo demás y HTML siempre revalidado (no-cache).
    # - Ver odd/tasks/client-heavy-optimization.md
    # ============================================================

    # Backend InsForge (same-origin)
    # El navegador llama al MISMO origen de la app y nginx proxyea estos
    # prefijos al backend: las cookies de sesión quedan first-party y
    # Chrome las guarda. proxy_cookie_flags reescribe SameSite=None →
    # SameSite=Lax (Chrome rechaza SameSite=None sin Secure por HTTP;
    # Lax funciona same-origin tanto en HTTP como HTTPS).
    # El límite de 10m del storage coincide con el máximo de avatar de la
    # app (src/lib/fileValidation.ts, default 10MB).
    # Ver odd/tasks/insforge-session-proxy.md
    location /api/auth/ {
        proxy_pass http://192.168.50.121:7130;
        proxy_cookie_flags insforge_refresh_token samesite=lax;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/database/ {
        proxy_pass http://192.168.50.121:7130;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # IA del backend InsForge (chat completions/embeddings/imágenes).
    # Auditoría F3 (2026-10-18): este prefijo es público y NO va por el
    # endpoint /api/coach (la única legítima es server-side directa a
    # INSFORGE_URL, ver src/pages/api/coach.ts:286), así que exponerlo
    # desde nginx permitía usar el gateway sin cuota con la anon key.
    # Cerrado: la app no consume /api/ai/* desde el cliente (spec S2 de
    # ia-coach-mvp lo prohibe explícitamente).
    location /api/ai/ {
        return 404;
    }

    location /api/storage/ {
        proxy_pass http://192.168.50.121:7130;
        client_max_body_size 10m;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # Assets de build con hash (dist/client/_astro/*.{js,css,...})
    # Servidos desde DISCO por nginx (sin Node). ^~ está antes de las
    # regex locations, así no lo captura la regex de public/ de abajo.
    # Inmutable 1y: el nombre lleva hash de contenido.
    # ============================================================
    location ^~ /_astro/ {
        root /app/dist/client;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header no hereda del server block: re-declarar
        add_header X-XSS-Protection "0" always;
        try_files $uri @ssr_fallback;
    }

    # ============================================================
    # Assets públicos de public/ SIN hash (favicon, robots, og-image…)
    # Caché moderada: 7d (no se puede inmutable, el nombre no cambia).
    # ============================================================
    location ~* ^/(favicon\.svg|favicon-16x16\.png|favicon-32x32\.png|favicon\.ico|apple-touch-icon\.png|robots\.txt|og-image\.png)$ {
        root /app/dist/client;
        gzip_static on;
        add_header Cache-Control "public, max-age=604800";
        add_header X-XSS-Protection "0" always;
        try_files $uri @ssr_fallback;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Todo lo demás → Astro SSR (HTML revalidado siempre: no-cache).
    location / {
        proxy_pass http://127.0.0.1:1412;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix for Astro routes
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # HTML siempre revalidado (moderado: el navegador lo cachea pero
        # pide ETag/If-None-Match en cada visita → nunca stale shell).
        add_header Cache-Control "no-cache" always;
        # add_header no hereda del server block: re-declarar
        add_header X-XSS-Protection "0" always;
    }

    # Fallback a Astro si un asset pedido no existe aún en disco
    # (p. ej. un HTML viejo en caché pide un hash viejo).
    location @ssr_fallback {
        proxy_pass http://127.0.0.1:1412;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-XSS-Protection "0" always;
    }
}
