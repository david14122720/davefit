server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-XSS-Protection "0" always;

    # ============================================================
    # Backend InsForge (same-origin)
    # ============================================================
    # El navegador llama al MISMO origen de la app y nginx proxyea estos
    # prefijos al backend: las cookies de sesión quedan first-party y
    # Chrome las guarda. proxy_cookie_flags reescribe SameSite=None →
    # SameSite=Lax (Chrome rechaza SameSite=None sin Secure por HTTP;
    # Lax funciona same-origin tanto en HTTP como HTTPS).
    # El límite de 10m del storage coincide con el máximo de avatar de la
    # app (src/lib/fileValidation.ts, default 10MB).
    # Ver odd/tasks/insforge-session-proxy.md
    # ============================================================
    location /api/auth/ {
        proxy_pass http://192.168.50.121:7130;
        proxy_cookie_flags insforge_refresh_token samesite=lax;
    }

    location /api/database/ {
        proxy_pass http://192.168.50.121:7130;
    }

    location /api/storage/ {
        proxy_pass http://192.168.50.121:7130;
        client_max_body_size 10m;
    }

    # Astro static assets
    location /_astro/ {
        proxy_pass http://127.0.0.1:1412;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # All other requests - Astro SSR
    location / {
        proxy_pass http://127.0.0.1:1412;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Fix for Astro routes
        proxy_redirect off;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
